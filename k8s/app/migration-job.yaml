apiVersion: batch/v1
kind: Job
metadata:
  name: async-furious-migrate
  namespace: async-furious
  labels:
    app.kubernetes.io/part-of: async-furious
    app.kubernetes.io/component: migration
    job: migration
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      # Sem app: async-furious-api: com ele o pod entraria no Service e no target group do ALB.
      labels:
        app.kubernetes.io/part-of: async-furious
        app.kubernetes.io/component: migration
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      containers:
        - name: migrate
          image: ${app_image}
          imagePullPolicy: IfNotPresent
          command: ["node_modules/.bin/prisma", "migrate", "deploy"]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
              ephemeral-storage: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
              ephemeral-storage: 1Gi
          envFrom:
            - configMapRef:
                name: async-furious-config
            - secretRef:
                name: async-furious-secret
