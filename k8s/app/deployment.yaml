apiVersion: apps/v1
kind: Deployment
metadata:
  name: async-furious-api
  namespace: async-furious
spec:
  replicas: ${app_replicas}
  selector:
    matchLabels:
      app: async-furious-api
  template:
    metadata:
      labels:
        app: async-furious-api
    spec:
      automountServiceAccountToken: false
      initContainers:
        - name: migrate
          image: ${app_image}
          imagePullPolicy: Never
          command: ["node_modules/.bin/prisma", "migrate", "deploy"]
          envFrom:
            - configMapRef:
                name: async-furious-config
            - secretRef:
                name: async-furious-secret
        - name: seed
          image: ${app_image}
          imagePullPolicy: Never
          command: ["node", "dist-scripts/seed.js"]
          envFrom:
            - configMapRef:
                name: async-furious-config
            - secretRef:
                name: async-furious-secret
      containers:
        - name: api
          image: ${app_image}
          imagePullPolicy: Never
          ports:
            - containerPort: 3000
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
              ephemeral-storage: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
              ephemeral-storage: "512Mi"
          envFrom:
            - configMapRef:
                name: async-furious-config
            - secretRef:
                name: async-furious-secret
          readinessProbe:
            httpGet:
              path: /api/v1
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/v1
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 10
