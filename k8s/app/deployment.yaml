apiVersion: apps/v1
kind: Deployment
metadata:
  name: async-furious-api
  namespace: async-furious
spec:
  replicas: 2
  selector:
    matchLabels:
      app: async-furious-api
  template:
    metadata:
      labels:
        app: async-furious-api
    spec:
      initContainers:
        - name: migrate
          image: async-furious-api:latest
          imagePullPolicy: Never
          command: ["node", "node_modules/.bin/prisma", "migrate", "deploy"]
          envFrom:
            - configMapRef:
                name: async-furious-config
            - secretRef:
                name: async-furious-secret
      containers:
        - name: api
          image: async-furious-api:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 3000
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          envFrom:
            - configMapRef:
                name: async-furious-config
            - secretRef:
                name: async-furious-secret
          readinessProbe:
            httpGet:
              path: /api/v1
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/v1
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 10
