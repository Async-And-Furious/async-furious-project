# Stand-in local do DocumentDB para o read model (ADR-0019). Sem volume: a
# projeção é descartável e se reconstrói com o job de rebuild a partir do Postgres.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: read-model
  namespace: async-furious
spec:
  replicas: 1
  selector:
    matchLabels: { app: read-model }
  template:
    metadata:
      labels: { app: read-model }
    spec:
      containers:
        - name: mongo
          image: mongo:5.0
          ports: [{ containerPort: 27017 }]
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: 500m, memory: 512Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: read-model-service
  namespace: async-furious
spec:
  selector: { app: read-model }
  ports: [{ port: 27017, targetPort: 27017 }]
