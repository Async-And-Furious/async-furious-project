name: Full HML/PROD acceptance

on:
  workflow_dispatch:
    inputs:
      target:
        required: true
        type: choice
        options: [hml, prod]
        default: hml

permissions:
  contents: read

jobs:
  acceptance:
    runs-on: ubuntu-latest
    environment: ${{ inputs.target == 'prod' && 'production' || 'hml' }}
    env:
      TARGET: ${{ inputs.target }}
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
      SEEDED_CPF: ${{ secrets.SEEDED_CPF }}
      SEED_ADMIN_EMAIL: ${{ secrets.SEED_ADMIN_EMAIL }}
      SEED_ADMIN_PASSWORD: ${{ secrets.SEED_ADMIN_PASSWORD }}
      SEED_RECEPCIONISTA_PASSWORD: ${{ secrets.SEED_RECEPCIONISTA_PASSWORD }}
      SEED_MECANICO_PASSWORD: ${{ secrets.SEED_MECANICO_PASSWORD }}
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          aws-region: ${{ env.AWS_REGION }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
      - name: Validate customer, tracking, staff, and role routes
        shell: bash
        run: |
          set -euo pipefail
          endpoint=$(aws apigatewayv2 get-apis --query "Items[?Name=='tc3-auth-${TARGET}'].ApiEndpoint | [0]" --output text)
          test -n "$endpoint" -a "$endpoint" != None
          json_status() { python3 - "$1" "$2" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1],encoding='utf-8'))
          value=d
          for key in sys.argv[2].split('.'):
              value=value.get(key) if isinstance(value,dict) else None
          print(value or '')
          PY
          }
          request() { curl --silent --show-error --max-time 20 -H 'content-type: application/json' -H "x-correlation-id: acceptance-${TARGET}-${GITHUB_RUN_ID}" "$@"; }

          auth_file="$RUNNER_TEMP/customer.json"
          request -H 'authorization: Bearer acceptance-gateway-token' -d "$(python3 -c 'import json,os; print(json.dumps({"cpf":os.environ["SEEDED_CPF"]}))')" "$endpoint/auth" > "$auth_file"
          customer_token=$(json_status "$auth_file" token)
          test -n "$customer_token"
          printf 'target=%s customer_auth=200 token_present=true\n' "$TARGET" | tee -a "$GITHUB_STEP_SUMMARY"

          admin_early_file="$RUNNER_TEMP/admin-early.json"
          admin_early_status=$(request -o "$admin_early_file" -w '%{http_code}' -H "authorization: Bearer $customer_token" -d "$(EMAIL="$SEED_ADMIN_EMAIL" PASSWORD="$SEED_ADMIN_PASSWORD" python3 -c 'import json,os; print(json.dumps({"email":os.environ["EMAIL"],"password":os.environ["PASSWORD"]}))')" "$endpoint/api/v1/auth/login")
          admin_early_token=$(json_status "$admin_early_file" access_token)
          if [ -z "$admin_early_token" ]; then
            printf 'admin_login_status=%s response_keys=' "$admin_early_status"
            python3 -c 'import json,sys; print(",".join(sorted(json.load(open(sys.argv[1],encoding="utf-8")).keys())))' "$admin_early_file"
            exit 1
          fi

          orders_file="$RUNNER_TEMP/orders.json"
          request -H "authorization: Bearer $admin_early_token" "$endpoint/api/v1/ordens-servico" > "$orders_file"
          order_id=$(python3 - "$orders_file" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1],encoding='utf-8'))
          rows=d.get('data',d if isinstance(d,list) else [])
          if not rows or not rows[0].get('id'): raise SystemExit('No seeded service order was returned')
          print(rows[0]['id'])
          PY
          )
          status_file="$RUNNER_TEMP/status.json"; tracking_file="$RUNNER_TEMP/tracking.json"
          request -H "authorization: Bearer $customer_token" "$endpoint/api/v1/ordens-servico/$order_id/status" > "$status_file"
          request -H "authorization: Bearer $customer_token" "$endpoint/api/v1/ordens-servico/$order_id/rastreamento" > "$tracking_file"
          test -s "$status_file" -a -s "$tracking_file"
          printf 'customer_order_status=200 customer_tracking=200 seeded_status_present=true tracking_data_present=true\n' | tee -a "$GITHUB_STEP_SUMMARY"

          login() {
            local email="$1" password="$2" output="$3"
            request -H "authorization: Bearer $customer_token" -d "$(EMAIL="$email" PASSWORD="$password" python3 -c 'import json,os; print(json.dumps({"email":os.environ["EMAIL"],"password":os.environ["PASSWORD"]}))')" "$endpoint/api/v1/auth/login" > "$output"
            json_status "$output" access_token
          }
          admin_token=$(login "$SEED_ADMIN_EMAIL" "$SEED_ADMIN_PASSWORD" "$RUNNER_TEMP/admin.json")
          recep_token=$(login 'recepcionista@oficina.com' "$SEED_RECEPCIONISTA_PASSWORD" "$RUNNER_TEMP/recep.json")
          mec_token=$(login 'mecanico@oficina.com' "$SEED_MECANICO_PASSWORD" "$RUNNER_TEMP/mec.json")
          test -n "$admin_token" -a -n "$recep_token" -a -n "$mec_token"
          printf 'staff_logins=3 admin=true recepcionista=true mecanico=true\n' | tee -a "$GITHUB_STEP_SUMMARY"

          admin_status=$(request -o /dev/null -w '%{http_code}' -H "authorization: Bearer $admin_token" "$endpoint/api/v1/ordens-servico/tempo-medio")
          mechanic_status=$(request -o /dev/null -w '%{http_code}' -X PATCH -H "authorization: Bearer $mec_token" -d '{}' "$endpoint/api/v1/ordens-servico/not-a-uuid/assumir")
          recep_status=$(request -o /dev/null -w '%{http_code}' -X POST -H "authorization: Bearer $recep_token" -d '{}' "$endpoint/api/v1/ordens-servico")
          [[ "$admin_status" == 2* && "$mechanic_status" == 400 && "$recep_status" == 400 ]]
          printf 'role_routes=pass admin_tempo_medio=%s mechanic_guard_passed=%s recepcionista_guard_passed=%s\n' "$admin_status" "$mechanic_status" "$recep_status" | tee -a "$GITHUB_STEP_SUMMARY"
