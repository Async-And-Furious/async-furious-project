name: Protected API route diagnostics

on:
  pull_request:
  workflow_dispatch:
    inputs:
      target:
        description: Diagnostics target
        required: true
        type: choice
        options:
          - hml
          - prod
        default: hml

permissions:
  contents: read

jobs:
  hml:
    name: HML protected routes and EKS health
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.target == 'hml' }}
    runs-on: ubuntu-latest
    environment: hml
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
      SEEDED_CPF: ${{ secrets.SEEDED_CPF }}
      EKS_CLUSTER_NAME: ${{ vars.EKS_CLUSTER_NAME }}
      K8S_NAMESPACE: ${{ vars.K8S_NAMESPACE || 'async-furious' }}
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          aws-region: ${{ env.AWS_REGION }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
      - name: Save HML EKS endpoint access
        run: |
          set -euo pipefail
          test -n "$EKS_CLUSTER_NAME" || { echo 'EKS_CLUSTER_NAME is required for HML diagnostics.' >&2; exit 1; }
          aws eks describe-cluster --region "$AWS_REGION" --name "$EKS_CLUSTER_NAME" \
            --query 'cluster.resourcesVpcConfig.{endpointPrivateAccess:endpointPrivateAccess,endpointPublicAccess:endpointPublicAccess,publicAccessCidrs:publicAccessCidrs}' \
            --output json > "$RUNNER_TEMP/eks-hml-endpoint-access.json"
      - name: Allow only this runner to reach HML EKS
        run: |
          set -euo pipefail
          runner_ip=$(curl --fail --silent --show-error --ipv4 --proto '=https' https://checkip.amazonaws.com)
          runner_ip=$(python3 - "$runner_ip" <<'PY'
          import ipaddress
          import sys
          address = ipaddress.ip_address(sys.argv[1].strip())
          if address.version != 4 or not address.is_global:
              raise SystemExit(f"Runner address is not a globally routable IPv4: {address}")
          print(address)
          PY
          )
          access="endpointPrivateAccess=true,endpointPublicAccess=true,publicAccessCidrs=${runner_ip}/32"
          error_file=$(mktemp)
          trap 'rm -f "$error_file"' EXIT
          deadline=$((SECONDS + 600))
          while ! update_id=$(aws eks update-cluster-config --region "$AWS_REGION" --name "$EKS_CLUSTER_NAME" \
            --resources-vpc-config "$access" --query 'update.id' --output text 2>"$error_file"); do
            error=$(<"$error_file")
            [[ "$error" == *ResourceInUseException* ]] || { printf '%s\n' "$error" >&2; exit 1; }
            (( SECONDS < deadline )) || { echo 'Timed out allowing the HML runner.' >&2; exit 1; }
            sleep 10
          done
          deadline=$((SECONDS + 600))
          while (( SECONDS < deadline )); do
            status=$(aws eks describe-update --region "$AWS_REGION" --name "$EKS_CLUSTER_NAME" --update-id "$update_id" --query 'update.status' --output text)
            [[ "$status" == Successful ]] && { echo 'HML EKS access temporarily restricted to this runner /32.'; exit 0; }
            [[ "$status" == Failed || "$status" == Cancelled ]] && { echo "HML EKS access update ended with status $status." >&2; exit 1; }
            sleep 10
          done
          echo 'Timed out waiting for HML EKS access.' >&2
          exit 1
      - name: Configure kubectl for HML
        run: |
          set -euo pipefail
          aws eks update-kubeconfig --name "$EKS_CLUSTER_NAME" --region "$AWS_REGION" >/dev/null
          kubectl get --raw=/readyz
      - name: Inspect HML API Gateway integration metadata
        run: |
          set -euo pipefail
          api_id=$(aws apigatewayv2 get-apis --query "Items[?Name=='tc3-auth-hml'].ApiId | [0]" --output text)
          test -n "$api_id" -a "$api_id" != None
          aws apigatewayv2 get-api --api-id "$api_id" \
            --query '{protocol:ProtocolType,endpoint:ApiEndpoint,disable_execute_api_endpoint:DisableExecuteApiEndpoint}' --output json
          aws apigatewayv2 get-routes --api-id "$api_id" \
            --query 'Items[].{route:RouteKey,target:Target,authorizationType:AuthorizationType,authorizerId:AuthorizerId}' --output json
          aws apigatewayv2 get-integrations --api-id "$api_id" \
            --query 'Items[].{integrationId:IntegrationId,type:IntegrationType,method:IntegrationMethod,uri:IntegrationUri,connectionType:ConnectionType,connectionId:ConnectionId,payloadFormatVersion:PayloadFormatVersion,timeout:TimeoutInMillis}' --output json
      - name: Authenticate and inspect protected routes
        shell: bash
        run: |
          set -euo pipefail
          endpoint="$(aws apigatewayv2 get-apis --query "Items[?Name=='tc3-auth-hml'].ApiEndpoint | [0]" --output text)"
          auth_payload="$(curl --silent --show-error --max-time 20 -H 'content-type: application/json' -d "$(python -c 'import json,os; print(json.dumps({"cpf":os.environ["SEEDED_CPF"]}))')" --write-out $'\n%{http_code}' "$endpoint/auth")"
          auth_status="${auth_payload##*$'\n'}"; auth_body="${auth_payload%$'\n'*}"
          token="$(printf '%s' "$auth_body" | python -c 'import json,sys; print(json.load(sys.stdin).get("token", ""))')"
          printf 'hml POST /auth %s %s\n' "$auth_status" "$(case "$auth_status" in 2*) echo none;; 4*) echo http_4xx;; 5*) echo http_5xx;; *) echo http_other;; esac)"
          test -n "$token"
          for path in /api/v1/health/live /api/v1/clientes; do
            status="$(curl --silent --show-error --max-time 20 -o /dev/null -w '%{http_code}' -H "authorization: Bearer $token" -H "x-correlation-id: github-protected-hml-${GITHUB_RUN_ID}" "$endpoint$path")"
            printf 'hml GET %s %s %s\n' "$path" "$status" "$(case "$status" in 2*) echo none;; 4*) echo http_4xx;; 5*) echo http_5xx;; *) echo http_other;; esac)"
          done
      - name: Capture HML Kubernetes and ALB evidence
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          kubectl get pods --namespace "$K8S_NAMESPACE" -o wide || true
          kubectl get services --namespace "$K8S_NAMESPACE" -o wide || true
          kubectl get ingress --namespace "$K8S_NAMESPACE" -o wide || true
          kubectl get events --namespace "$K8S_NAMESPACE" --sort-by='.metadata.creationTimestamp' || true
          kubectl rollout status deployment/async-furious-api --namespace "$K8S_NAMESPACE" --timeout=45s || true
          kubectl get deployment/async-furious-api --namespace "$K8S_NAMESPACE" -o wide || true
          kubectl describe deployment/async-furious-api --namespace "$K8S_NAMESPACE" || true
          kubectl describe pods --namespace "$K8S_NAMESPACE" -l app=async-furious-api || true
          kubectl logs --namespace "$K8S_NAMESPACE" -l app=async-furious-api --all-containers=true --tail=200 2>/dev/null \
            | sed -E 's/(Authorization: Bearer|"token"[[:space:]]*:[[:space:]]*|"cpf"[[:space:]]*:[[:space:]]*|"password"[[:space:]]*:[[:space:]]*)[^ ,}]*/\1[REDACTED]/Ig' || true
          tgb_json="$RUNNER_TEMP/tgb.json"
          kubectl get targetgroupbinding --namespace "$K8S_NAMESPACE" -o json > "$tgb_json" || true
          python3 - "$tgb_json" <<'PY'
          import json,sys
          try:
              items=json.load(open(sys.argv[1],encoding='utf-8')).get('items',[])
          except (FileNotFoundError,json.JSONDecodeError):
              items=[]
          for item in items:
              arn=(item.get('spec') or {}).get('targetGroupARN')
              if arn:
                  print(arn)
          PY
          while IFS= read -r target_group; do
            test -n "$target_group" || continue
            aws elbv2 describe-target-health --target-group-arn "$target_group" \
              --query 'TargetHealthDescriptions[].{state:TargetHealth.State,reason:TargetHealth.Reason}' --output json || true
          done < <(python3 - "$tgb_json" <<'PY'
          import json,sys
          try:
              items=json.load(open(sys.argv[1],encoding='utf-8')).get('items',[])
          except (FileNotFoundError,json.JSONDecodeError):
              items=[]
          for item in items:
              arn=(item.get('spec') or {}).get('targetGroupARN')
              if arn:
                  print(arn)
          PY
          )
      - name: Restore HML EKS endpoint to private
        if: ${{ always() }}
        run: |
          set -euo pipefail
          error_file=$(mktemp)
          trap 'status=$?; rm -f "$error_file"; exit "$status"' EXIT
          deadline=$((SECONDS + 600))
          while ! update_id=$(aws eks update-cluster-config --region "$AWS_REGION" --name "$EKS_CLUSTER_NAME" \
            --resources-vpc-config endpointPrivateAccess=true,endpointPublicAccess=false \
            --query 'update.id' --output text 2>"$error_file"); do
            error=$(<"$error_file")
            [[ "$error" == *ResourceNotFoundException* || "$error" == *'already at the desired configuration'* ]] && { echo 'HML EKS endpoint already has the requested cleanup configuration.'; exit 0; }
            [[ "$error" == *ResourceInUseException* ]] || { printf '%s\n' "$error" >&2; exit 1; }
            (( SECONDS < deadline )) || { echo 'Timed out requesting private HML EKS cleanup.' >&2; exit 1; }
            sleep 10
          done
          deadline=$((SECONDS + 600))
          while (( SECONDS < deadline )); do
            status=$(aws eks describe-update --region "$AWS_REGION" --name "$EKS_CLUSTER_NAME" --update-id "$update_id" --query 'update.status' --output text)
            [[ "$status" == Successful ]] && { echo 'HML EKS endpoint is private again.'; exit 0; }
            [[ "$status" == Failed || "$status" == Cancelled ]] && { echo "Private HML EKS cleanup ended with status $status." >&2; exit 1; }
            sleep 10
          done
          echo 'Timed out waiting for private HML EKS cleanup.' >&2
          exit 1

  prod:
    name: PROD protected routes and authorizer
    if: ${{ github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || inputs.target == 'prod') }}
    runs-on: ubuntu-latest
    environment: production
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
      SEEDED_CPF: ${{ secrets.SEEDED_CPF }}
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          aws-region: ${{ env.AWS_REGION }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
      - name: Authenticate, inspect authorizer artifact and protected routes
        shell: bash
        run: |
          set -euo pipefail
          api_id="$(aws apigatewayv2 get-apis --query "Items[?Name=='tc3-auth-prod'].ApiId | [0]" --output text)"
          endpoint="$(aws apigatewayv2 get-apis --query "Items[?Name=='tc3-auth-prod'].ApiEndpoint | [0]" --output text)"
          auth_payload="$(curl --silent --show-error --max-time 20 -H 'content-type: application/json' -d "$(python -c 'import json,os; print(json.dumps({"cpf":os.environ["SEEDED_CPF"]}))')" --write-out $'\n%{http_code}' "$endpoint/auth")"
          auth_status="${auth_payload##*$'\n'}"; auth_body="${auth_payload%$'\n'*}"
          token="$(printf '%s' "$auth_body" | python -c 'import json,sys; print(json.load(sys.stdin).get("token", ""))')"
          printf 'prod POST /auth %s %s\n' "$auth_status" "$(case "$auth_status" in 2*) echo none;; 4*) echo http_4xx;; 5*) echo http_5xx;; *) echo http_other;; esac)"
          test -n "$token"
          for path in /api/v1/health/live /api/v1/clientes; do
            status="$(curl --silent --show-error --max-time 20 -o /dev/null -w '%{http_code}' -H "authorization: Bearer $token" -H "x-correlation-id: github-protected-prod-${GITHUB_RUN_ID}" "$endpoint$path")"
            printf 'prod GET %s %s %s\n' "$path" "$status" "$(case "$status" in 2*) echo none;; 4*) echo http_4xx;; 5*) echo http_5xx;; *) echo http_other;; esac)"
          done
          function_name='tc3-auth-prod-authorizer'; config="$RUNNER_TEMP/authorizer.json"
          aws lambda get-function-configuration --function-name "$function_name" --output json > "$config"
          python - "$config" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1],encoding='utf-8'))
          print(json.dumps({'version':d.get('Version'),'last_modified':d.get('LastModified'),'code_sha256':d.get('CodeSha256'),'handler':d.get('Handler'),'runtime':d.get('Runtime')},sort_keys=True))
          env=(d.get('Environment') or {}).get('Variables',{})
          open('/tmp/public-name','w').write(env.get('JWT_PUBLIC_KEY_PARAM_NAME',''))
          open('/tmp/issuer','w').write(env.get('JWT_ISSUER',''))
          open('/tmp/audience','w').write(env.get('JWT_AUDIENCE',''))
          PY
          auth_config="$RUNNER_TEMP/auth.json"
          aws lambda get-function-configuration --function-name tc3-auth-prod-auth --output json > "$auth_config"
          python - "$auth_config" <<'PY'
          import json,sys
          env=(json.load(open(sys.argv[1],encoding='utf-8')).get('Environment') or {}).get('Variables',{})
          open('/tmp/private-arn','w').write(env.get('JWT_PRIVATE_KEY_SECRET_ARN',''))
          PY
          public_name="$(cat /tmp/public-name)"; private_arn="$(cat /tmp/private-arn)"
          aws ssm get-parameter --name "$public_name" --query 'Parameter.Value' --output text > "$RUNNER_TEMP/public-key.pem"
          aws secretsmanager get-secret-value --secret-id "$private_arn" --query 'SecretString' --output text > "$RUNNER_TEMP/private-secret.json"
          jwt_issuer="$(cat /tmp/issuer)"; jwt_audience="$(cat /tmp/audience)"
          TOKEN="$token" PUBLIC_FILE="$RUNNER_TEMP/public-key.pem" PRIVATE_FILE="$RUNNER_TEMP/private-secret.json" JWT_ISSUER="$jwt_issuer" JWT_AUDIENCE="$jwt_audience" node --input-type=module <<'JS'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          const token=process.env.TOKEN;
          const publicPem=fs.readFileSync(process.env.PUBLIC_FILE,'utf8');
          const secretText=fs.readFileSync(process.env.PRIVATE_FILE,'utf8').trim();
          const decode=(value)=>Buffer.from(value.replace(/-/g,'+').replace(/_/g,'/')+'='.repeat((4-value.length%4)%4),'base64');
          const fingerprint=(pem)=>crypto.createHash('sha256').update(crypto.createPublicKey(pem).export({type:'spki',format:'der'})).digest('hex');
          const parts=token.split('.'); const header=JSON.parse(decode(parts[0]).toString('utf8')); const claims=JSON.parse(decode(parts[1]).toString('utf8'));
          const publicFingerprint=fingerprint(publicPem); let signerFingerprint=null; let secretJsonKeys=[]; let candidateCount=0;
          try { const parsed=JSON.parse(secretText); secretJsonKeys=Object.keys(parsed||{}); for (const candidate of Object.values(parsed||{})) { if (typeof candidate==='string') { candidateCount++; try { signerFingerprint=fingerprint(candidate); break; } catch {} } } } catch { candidateCount=1; try { signerFingerprint=fingerprint(secretText); } catch {} }
          const now=Math.floor(Date.now()/1000);
          const signatureValid=crypto.verify('RSA-SHA256',Buffer.from(`${parts[0]}.${parts[1]}`),crypto.createPublicKey(publicPem),decode(parts[2]));
          console.log(JSON.stringify({key_pair_match:signerFingerprint===publicFingerprint,public_key_fingerprint:publicFingerprint,signer_public_key_fingerprint:signerFingerprint,private_secret_json_keys:secretJsonKeys,private_secret_candidate_count:candidateCount,jwt:{alg:header.alg,typ:header.typ,claim_names:Object.keys(claims).sort(),issuer_match:claims.iss===process.env.JWT_ISSUER,audience_match:claims.aud===process.env.JWT_AUDIENCE,signature_valid:signatureValid,not_expired:typeof claims.exp==='number'&&claims.exp>now}}));
          JS
          account_id="$(aws sts get-caller-identity --query Account --output text)"; api_host="${endpoint#https://}"; direct_correlation="github-prod-direct-${GITHUB_RUN_ID}"
          direct_payload="$(TOKEN="$token" CORRELATION="$direct_correlation" API_ID="$api_id" API_HOST="$api_host" ACCOUNT_ID="$account_id" AWS_REGION="$AWS_REGION" python - <<'PY'
          import json,os,sys,time
          path='/api/v1/health/live'; method='GET'; correlation=os.environ['CORRELATION']
          json.dump({'version':'2.0','routeKey':f'{method} {path}','rawPath':path,'rawQueryString':'','headers':{'authorization':'Bearer '+os.environ['TOKEN'],'host':os.environ['API_HOST'],'x-correlation-id':correlation},'requestContext':{'accountId':os.environ['ACCOUNT_ID'],'apiId':os.environ['API_ID'],'domainName':os.environ['API_HOST'],'domainPrefix':os.environ['API_ID'],'http':{'method':method,'path':path,'protocol':'HTTP/1.1','sourceIp':'127.0.0.1','userAgent':'GitHubActions'},'requestId':correlation,'routeKey':f'{method} {path}','stage':'$default','time':'13/Sep/2026:00:00:00 +0000','timeEpoch':int(time.time()*1000)},'stageVariables':None,'isBase64Encoded':False},sys.stdout)
          PY
          )"
          aws lambda invoke --function-name "$function_name" --cli-binary-format raw-in-base64-out --payload "$direct_payload" "$RUNNER_TEMP/authorizer-response.json" >/dev/null
          python - "$RUNNER_TEMP/authorizer-response.json" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1],encoding='utf-8')); print(json.dumps({'direct_authorizer_status':d.get('StatusCode'),'isAuthorized':d.get('isAuthorized'),'error_class':d.get('FunctionError')}))
          PY
