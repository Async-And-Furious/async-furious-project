name: Comprehensive seed on EKS

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Protected target environment
        required: true
        type: choice
        options: [hml]
        default: hml

permissions:
  contents: read
  id-token: write

jobs:
  # Protege chamadas manuais legadas: a Fase 4 não permite seed em PROD.
  prod-guard:
    name: Enforce HML-only seed
    runs-on: ubuntu-latest
    steps:
      - name: Refuse PROD seed in Phase 4
        if: ${{ inputs.environment == 'prod' }}
        run: |
          echo "Phase 4 is HML-only; PROD seeding is disabled." >&2
          exit 1

  first-run:
    name: Seed ${{ inputs.environment }} (first run)
    needs: prod-guard
    uses: ./.github/workflows/deploy-eks.yml
    with:
      environment: ${{ inputs.environment }}
      seed_prod: ${{ inputs.environment == 'prod' }}
      seed_comprehensive: true
    secrets: inherit

  second-run:
    name: Seed ${{ inputs.environment }} (idempotency run)
    needs: first-run
    uses: ./.github/workflows/deploy-eks.yml
    with:
      environment: ${{ inputs.environment }}
      seed_prod: ${{ inputs.environment == 'prod' }}
      seed_comprehensive: true
    secrets: inherit
