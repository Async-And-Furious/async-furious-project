name: Sonar quality gate

on:
  pull_request:
  push:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  sonar:
    name: Analyze when Sonar is configured
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Skip when Sonar is not configured
        if: env.SONAR_TOKEN == ''
        run: echo 'SONAR_TOKEN is not configured; Sonar analysis is skipped.' >> "$GITHUB_STEP_SUMMARY"

      - name: Setup pnpm
        if: env.SONAR_TOKEN != ''
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        if: env.SONAR_TOKEN != ''
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        if: env.SONAR_TOKEN != ''
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        if: env.SONAR_TOKEN != ''
        run: pnpm exec prisma generate

      - name: Test with coverage
        if: env.SONAR_TOKEN != ''
        run: pnpm run test:cov

      - name: Sonar analysis
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL || 'https://sonarcloud.io' }}

      - name: Sonar quality gate
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-quality-gate-action@v1.2.0
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL || 'https://sonarcloud.io' }}
