name: DAST - OWASP ZAP

on:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

jobs:
  zap-scan:
    name: ZAP API Scan
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: workshop
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Gerar cliente Prisma
        run: npx prisma generate

      - name: Preparar banco e seed
        run: |
          npx prisma db push --skip-generate
          npx ts-node scripts/seed.ts
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/workshop
          SEED_ADMIN_EMAIL: admin@oficina.com
          SEED_ADMIN_PASSWORD: changeme123

      - name: Iniciar aplicação
        run: pnpm run start &
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/workshop
          JWT_SECRET: zap-test-jwt-secret-key
          PORT: 5000

      - name: Aguardar aplicação ficar pronta
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:5000/api/v1/ && echo "App pronta!" && break
            echo "Aguardando... ($i/30)" && sleep 3
          done

      - name: ZAP API Scan
        uses: zaproxy/action-api-scan@77dfa9a647bb0f583e39d4df8531634d6ddd8df4 # v0.9.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          docker_name: 'ghcr.io/zaproxy/zaproxy:stable'
          format: openapi
          target: 'http://localhost:5000/api/docs-json'
          rules_file_name: '.zap/rules.tsv'
          cmd_options: '-a'
          issue_title: 'ZAP DAST Scan - Async Furious API'
          fail_action: false
          artifact_name: zap-reports

      - name: Upload relatórios
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-reports
          path: |
            report_html.html
            report_json.json
          retention-days: 30
