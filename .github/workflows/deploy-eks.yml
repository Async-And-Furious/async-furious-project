name: Deploy monolith to Academy EKS

on:
  push:
    branches: [develop, main]
    paths:
      - 'src/**'
      - 'prisma/**'
      - 'scripts/seed.ts'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'Dockerfile'
      - 'k8s/**'
      - '.github/workflows/deploy-eks.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: Logical Academy environment
        required: true
        type: choice
        options: [hml, prod]
        default: hml

permissions:
  contents: read
  id-token: write

concurrency:
  group: app-eks-${{ github.event.inputs.environment || (github.ref == 'refs/heads/main' && 'prod' || 'hml') }}
  cancel-in-progress: false

env:
  K8S_NAMESPACE: async-furious
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}

jobs:
  image:
    name: Build and publish immutable image
    if: >-
      (github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main')) ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: ${{ ((github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.environment == 'prod')) && 'production' || 'hml' }}
    outputs:
      image: ${{ steps.image.outputs.ref }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d8 # v4

      - name: Production credential preflight
        if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.environment == 'prod') }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
          AWS_ROLE_TO_ASSUME: ${{ vars.AWS_ROLE_TO_ASSUME }}
        run: |
          set -euo pipefail
          for value in AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_SESSION_TOKEN; do
            test -z "${!value:-}" || { echo "Production must not use AWS Academy/static credentials ($value)." >&2; exit 1; }
          done
          [[ "$AWS_ROLE_TO_ASSUME" =~ ^arn:aws:iam::[0-9]{12}:role/.+ ]] || {
            echo 'Production AWS_ROLE_TO_ASSUME must be a protected IAM role ARN for OIDC.' >&2
            exit 1
          }
          test -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" || { echo 'Production OIDC token URL is unavailable.' >&2; exit 1; }
          test -n "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" || { echo 'Production OIDC token is unavailable.' >&2; exit 1; }

      - name: Configure AWS Academy credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        if: ${{ !(github.event_name == 'push' && github.ref == 'refs/heads/main') && !(github.event_name == 'workflow_dispatch' && inputs.environment == 'prod') }}
        with:
          aws-region: ${{ env.AWS_REGION }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}

      - name: Configure production AWS role
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.environment == 'prod') }}
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}
          role-session-name: deploy-${{ github.run_id }}

      - name: Credential and ECR preflight
        run: |
          set -euo pipefail
          test -n "$ECR_REPOSITORY" || { echo 'Repository variable ECR_REPOSITORY is required.' >&2; exit 1; }
          aws sts get-caller-identity >/dev/null
          aws ecr describe-repositories --repository-names "$ECR_REPOSITORY" >/dev/null

      - name: Login to ECR
        id: registry
        run: |
          set -euo pipefail
          account_id=$(aws sts get-caller-identity --query Account --output text)
          registry="$account_id.dkr.ecr.$AWS_REGION.amazonaws.com"
          aws ecr get-login-password | docker login --username AWS --password-stdin "$registry"
          echo "registry=$registry" >> "$GITHUB_OUTPUT"

      - name: Build and push commit-SHA image
        id: image
        env:
          REGISTRY: ${{ steps.registry.outputs.registry }}
        run: |
          set -euo pipefail
          image="$REGISTRY/$ECR_REPOSITORY:$GITHUB_SHA"
          docker build --pull --tag "$image" .
          docker push "$image"
          echo "ref=$image" >> "$GITHUB_OUTPUT"

  deploy-hml:
    name: Deploy HML
    needs: image
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/develop') ||
      (github.event_name == 'workflow_dispatch' && inputs.environment == 'hml')
    runs-on: ubuntu-latest
    environment: hml
    env:
      EKS_CLUSTER_NAME: ${{ vars.EKS_CLUSTER_NAME }}
      IMAGE: ${{ needs.image.outputs.image }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      SEED_ADMIN_EMAIL: ${{ secrets.SEED_ADMIN_EMAIL }}
      SEED_ADMIN_PASSWORD: ${{ secrets.SEED_ADMIN_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d8 # v4
      - name: Configure AWS Academy credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          aws-region: ${{ env.AWS_REGION }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
      - name: Setup kubectl
        uses: azure/setup-kubectl@829323503d1be3d00ca8346e5391ca0b07a9ab0d # v5
      - name: Save original HML EKS endpoint access
        run: |
          set -euo pipefail
          state_file="$RUNNER_TEMP/eks-hml-endpoint-access.json"
          aws eks describe-cluster --region "$AWS_REGION" --name "$EKS_CLUSTER_NAME" \
            --query 'cluster.resourcesVpcConfig.{endpointPrivateAccess:endpointPrivateAccess,endpointPublicAccess:endpointPublicAccess,publicAccessCidrs:publicAccessCidrs}' \
            --output json > "$state_file"
          python3 - "$state_file" <<'PY'
          import json
          import sys

          state = json.load(open(sys.argv[1]))
          if not isinstance(state["publicAccessCidrs"], list):
              raise SystemExit("EKS public access CIDRs were not returned as a list")
          PY
          echo 'Saved original HML EKS endpoint access settings.' >> "$GITHUB_STEP_SUMMARY"
      - name: Allow HML runner to reach Academy EKS
        run: |
          set -euo pipefail
          state_file="$RUNNER_TEMP/eks-hml-endpoint-access.json"
          runner_ip=$(curl --fail --silent --show-error --ipv4 --proto '=https' https://checkip.amazonaws.com)
          runner_ip=$(python3 - "$runner_ip" <<'PY'
          import ipaddress
          import sys

          address = ipaddress.ip_address(sys.argv[1].strip())
          if address.version != 4 or not address.is_global:
              raise SystemExit(f"Runner address is not a globally routable IPv4: {address}")
          print(address)
          PY
          )
          access=$(python3 - "$state_file" "$runner_ip" <<'PY'
          import json
          import sys

          state = json.load(open(sys.argv[1]))
          cidrs = list(dict.fromkeys([*state["publicAccessCidrs"], f"{sys.argv[2]}/32"]))
          print(f"endpointPrivateAccess={str(state['endpointPrivateAccess']).lower()},endpointPublicAccess=true,publicAccessCidrs={','.join(cidrs)}")
          PY
          )
          error_file=$(mktemp)
          trap 'rm -f "$error_file"' EXIT
          deadline=$((SECONDS + 600))
          while ! update_id=$(aws eks update-cluster-config \
            --region "$AWS_REGION" --name "$EKS_CLUSTER_NAME" \
            --resources-vpc-config "$access" --query 'update.id' --output text 2>"$error_file"); do
            error=$(<"$error_file")
            [[ "$error" == *ResourceInUseException* ]] || { printf '%s\n' "$error" >&2; exit 1; }
            (( SECONDS < deadline )) || { echo 'Timed out requesting HML EKS endpoint update.' >&2; exit 1; }
            sleep 10
          done
          deadline=$((SECONDS + 600))
          while (( SECONDS < deadline )); do
            status=$(aws eks describe-update --region "$AWS_REGION" --name "$EKS_CLUSTER_NAME" --update-id "$update_id" --query 'update.status' --output text)
            [[ "$status" == 'Successful' ]] && { echo "Temporarily added ${runner_ip}/32 to HML EKS." >> "$GITHUB_STEP_SUMMARY"; exit 0; }
            [[ "$status" == 'Failed' || "$status" == 'Cancelled' ]] && { echo "HML EKS endpoint update ended with status $status." >&2; exit 1; }
            sleep 10
          done
          echo 'Timed out waiting for HML EKS endpoint update.' >&2
          exit 1
      - name: Credential, cluster and state preflight
        run: |
          set -euo pipefail
          for value in EKS_CLUSTER_NAME DATABASE_URL JWT_SECRET SEED_ADMIN_EMAIL SEED_ADMIN_PASSWORD; do
            test -n "${!value:-}" || { echo "$value is required." >&2; exit 1; }
          done
          aws sts get-caller-identity >/dev/null
          status=$(aws eks describe-cluster --name "$EKS_CLUSTER_NAME" --query 'cluster.status' --output text)
          [[ "$status" == 'ACTIVE' ]] || { echo "EKS cluster is not ACTIVE: $status" >&2; exit 1; }
          aws eks update-kubeconfig --name "$EKS_CLUSTER_NAME" --region "$AWS_REGION"
          kubectl get --raw=/readyz >/dev/null
      - name: Apply namespace and configuration
        run: |
          set -euo pipefail
          kubectl apply -f k8s/namespace.yaml
          kubectl apply -f k8s/config/configmap.yaml
          kubectl create secret generic async-furious-secret \
            --namespace "$K8S_NAMESPACE" \
            --from-literal=DATABASE_URL="$DATABASE_URL" \
            --from-literal=JWT_SECRET="$JWT_SECRET" \
            --from-literal=SEED_ADMIN_EMAIL="$SEED_ADMIN_EMAIL" \
            --from-literal=SEED_ADMIN_PASSWORD="$SEED_ADMIN_PASSWORD" \
            --dry-run=client -o yaml | kubectl apply -f -
      - name: Run controlled Prisma migration
        run: |
          set -euo pipefail
          job="async-furious-migrate-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          kubectl apply -f - <<EOF
          apiVersion: batch/v1
          kind: Job
          metadata:
            name: $job
            namespace: $K8S_NAMESPACE
            labels:
              app.kubernetes.io/part-of: async-furious
              app.kubernetes.io/component: migration
          spec:
            backoffLimit: 4
            ttlSecondsAfterFinished: 86400
            template:
              spec:
                restartPolicy: OnFailure
                containers:
                  - name: migrate
                    image: $IMAGE
                    imagePullPolicy: IfNotPresent
                    command: ["node_modules/.bin/prisma", "migrate", "deploy"]
                    envFrom:
                      - configMapRef:
                          name: async-furious-config
                      - secretRef:
                          name: async-furious-secret
          EOF
          kubectl wait --for=condition=complete "job/$job" --namespace "$K8S_NAMESPACE" --timeout=10m || {
            kubectl logs "job/$job" --namespace "$K8S_NAMESPACE" --all-containers=true
            exit 1
          }
          kubectl logs "job/$job" --namespace "$K8S_NAMESPACE" --all-containers=true
          seed_job="async-furious-seed-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          kubectl apply -f - <<EOF
          apiVersion: batch/v1
          kind: Job
          metadata:
            name: $seed_job
            namespace: $K8S_NAMESPACE
            labels:
              app.kubernetes.io/part-of: async-furious
              app.kubernetes.io/component: seed
          spec:
            backoffLimit: 4
            ttlSecondsAfterFinished: 86400
            template:
              spec:
                restartPolicy: OnFailure
                containers:
                  - name: seed
                    image: $IMAGE
                    imagePullPolicy: IfNotPresent
                    command: ["node", "dist-scripts/seed.js"]
                    envFrom:
                      - configMapRef:
                          name: async-furious-config
                      - secretRef:
                          name: async-furious-secret
          EOF
          kubectl wait --for=condition=complete "job/$seed_job" --namespace "$K8S_NAMESPACE" --timeout=10m || {
            kubectl logs "job/$seed_job" --namespace "$K8S_NAMESPACE" --all-containers=true
            exit 1
          }
          kubectl logs "job/$seed_job" --namespace "$K8S_NAMESPACE" --all-containers=true
      - name: Roll out application
        run: |
          set -euo pipefail
          sed -e "s|\${app_image}|$IMAGE|g" -e 's|\${app_replicas}|2|g' k8s/app/deployment.yaml > "$RUNNER_TEMP/deployment.yaml"
          kubectl apply -f "$RUNNER_TEMP/deployment.yaml"
          kubectl apply -f k8s/app/service.yaml
          kubectl apply -f k8s/app/hpa.yaml
          kubectl rollout status deployment/async-furious-api --namespace "$K8S_NAMESPACE" --timeout=10m
          kubectl wait pods --namespace "$K8S_NAMESPACE" --selector app=async-furious-api --for=condition=Ready --timeout=5m

      - name: Restore original HML EKS endpoint access
        if: ${{ always() }}
        run: |
          set -euo pipefail
          state_file="$RUNNER_TEMP/eks-hml-endpoint-access.json"
          if [[ ! -s "$state_file" ]]; then
            echo 'No saved HML EKS endpoint state; nothing to restore.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          access=$(python3 - "$state_file" <<'PY'
          import json
          import sys

          state = json.load(open(sys.argv[1]))
          access = f"endpointPrivateAccess={str(state['endpointPrivateAccess']).lower()},endpointPublicAccess={str(state['endpointPublicAccess']).lower()}"
          if state['publicAccessCidrs']:
              access += f",publicAccessCidrs={','.join(state['publicAccessCidrs'])}"
          print(access)
          PY
          )
          error_file=$(mktemp)
          trap 'status=$?; rm -f "$error_file"; if (( status != 0 )); then echo "### HML EKS endpoint restoration failed (exit $status)." >> "$GITHUB_STEP_SUMMARY"; fi; exit "$status"' EXIT
          deadline=$((SECONDS + 600))
          while ! update_id=$(aws eks update-cluster-config \
            --region "$AWS_REGION" --name "$EKS_CLUSTER_NAME" \
            --resources-vpc-config "$access" --query 'update.id' --output text 2>"$error_file"); do
            error=$(<"$error_file")
            [[ "$error" == *ResourceNotFoundException* ]] && { echo 'HML EKS cluster no longer exists; endpoint state cannot be restored.' >> "$GITHUB_STEP_SUMMARY"; exit 0; }
            [[ "$error" == *ResourceInUseException* ]] || { printf '%s\n' "$error" >&2; exit 1; }
            (( SECONDS < deadline )) || { echo 'Timed out requesting HML EKS endpoint restoration.' >&2; exit 1; }
            sleep 10
          done
          deadline=$((SECONDS + 600))
          while (( SECONDS < deadline )); do
            status=$(aws eks describe-update --region "$AWS_REGION" --name "$EKS_CLUSTER_NAME" --update-id "$update_id" --query 'update.status' --output text)
            if [[ "$status" == 'Successful' ]]; then
              echo '### HML EKS endpoint access restored to the saved original settings.' >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            [[ "$status" == 'Failed' || "$status" == 'Cancelled' ]] && { echo "HML EKS endpoint restoration ended with status $status." >&2; exit 1; }
            sleep 10
          done
          echo 'Timed out waiting for HML EKS endpoint restoration.' >&2
          exit 1

  deploy-prod:
    name: Deploy PROD
    needs: image
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && inputs.environment == 'prod')
    runs-on: ubuntu-latest
    environment: production
    env:
      EKS_CLUSTER_NAME: ${{ vars.EKS_CLUSTER_NAME }}
      IMAGE: ${{ needs.image.outputs.image }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      SEED_ADMIN_EMAIL: ${{ secrets.SEED_ADMIN_EMAIL }}
      SEED_ADMIN_PASSWORD: ${{ secrets.SEED_ADMIN_PASSWORD }}
      AWS_ROLE_TO_ASSUME: ${{ vars.AWS_ROLE_TO_ASSUME }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d8 # v4
      - name: Production credential preflight
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
          AWS_ROLE_TO_ASSUME: ${{ vars.AWS_ROLE_TO_ASSUME }}
        run: |
          set -euo pipefail
          for value in AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_SESSION_TOKEN; do
            test -z "${!value:-}" || { echo "Production must not use AWS Academy/static credentials ($value)." >&2; exit 1; }
          done
          [[ "$AWS_ROLE_TO_ASSUME" =~ ^arn:aws:iam::[0-9]{12}:role/.+ ]] || {
            echo 'Production AWS_ROLE_TO_ASSUME must be a protected IAM role ARN for OIDC.' >&2
            exit 1
          }
          test -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" || { echo 'Production OIDC token URL is unavailable.' >&2; exit 1; }
          test -n "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" || { echo 'Production OIDC token is unavailable.' >&2; exit 1; }
      - name: Configure production AWS credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}
          role-session-name: deploy-${{ github.run_id }}
      - name: Setup kubectl
        uses: azure/setup-kubectl@829323503d1be3d00ca8346e5391ca0b07a9ab0d # v5
      - name: Credential, cluster and state preflight
        run: |
          set -euo pipefail
          for value in EKS_CLUSTER_NAME DATABASE_URL JWT_SECRET SEED_ADMIN_EMAIL SEED_ADMIN_PASSWORD AWS_ROLE_TO_ASSUME; do
            test -n "${!value:-}" || { echo "$value is required." >&2; exit 1; }
          done
          aws sts get-caller-identity >/dev/null
          status=$(aws eks describe-cluster --name "$EKS_CLUSTER_NAME" --query 'cluster.status' --output text)
          [[ "$status" == 'ACTIVE' ]] || { echo "EKS cluster is not ACTIVE: $status" >&2; exit 1; }
          aws eks update-kubeconfig --name "$EKS_CLUSTER_NAME" --region "$AWS_REGION"
          kubectl get --raw=/readyz >/dev/null
      - name: Apply namespace and configuration
        run: |
          set -euo pipefail
          kubectl apply -f k8s/namespace.yaml
          kubectl apply -f k8s/config/configmap.yaml
          kubectl create secret generic async-furious-secret \
            --namespace "$K8S_NAMESPACE" \
            --from-literal=DATABASE_URL="$DATABASE_URL" \
            --from-literal=JWT_SECRET="$JWT_SECRET" \
            --from-literal=SEED_ADMIN_EMAIL="$SEED_ADMIN_EMAIL" \
            --from-literal=SEED_ADMIN_PASSWORD="$SEED_ADMIN_PASSWORD" \
            --dry-run=client -o yaml | kubectl apply -f -
      - name: Run controlled Prisma migration
        run: |
          set -euo pipefail
          job="async-furious-migrate-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          kubectl apply -f - <<EOF
          apiVersion: batch/v1
          kind: Job
          metadata:
            name: $job
            namespace: $K8S_NAMESPACE
            labels:
              app.kubernetes.io/part-of: async-furious
              app.kubernetes.io/component: migration
          spec:
            backoffLimit: 4
            ttlSecondsAfterFinished: 86400
            template:
              spec:
                restartPolicy: OnFailure
                containers:
                  - name: migrate
                    image: $IMAGE
                    imagePullPolicy: IfNotPresent
                    command: ["node_modules/.bin/prisma", "migrate", "deploy"]
                    envFrom:
                      - configMapRef:
                          name: async-furious-config
                      - secretRef:
                          name: async-furious-secret
          EOF
          kubectl wait --for=condition=complete "job/$job" --namespace "$K8S_NAMESPACE" --timeout=10m || {
            kubectl logs "job/$job" --namespace "$K8S_NAMESPACE" --all-containers=true
            exit 1
          }
      - name: Run controlled seed
        run: |
          set -euo pipefail
          seed_job="async-furious-seed-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          kubectl apply -f - <<EOF
          apiVersion: batch/v1
          kind: Job
          metadata:
            name: $seed_job
            namespace: $K8S_NAMESPACE
            labels:
              app.kubernetes.io/part-of: async-furious
              app.kubernetes.io/component: seed
          spec:
            backoffLimit: 4
            ttlSecondsAfterFinished: 86400
            template:
              spec:
                restartPolicy: OnFailure
                containers:
                  - name: seed
                    image: $IMAGE
                    imagePullPolicy: IfNotPresent
                    command: ["node", "dist-scripts/seed.js"]
                    envFrom:
                      - configMapRef:
                          name: async-furious-config
                      - secretRef:
                          name: async-furious-secret
          EOF
          kubectl wait --for=condition=complete "job/$seed_job" --namespace "$K8S_NAMESPACE" --timeout=10m
          kubectl logs "job/$seed_job" --namespace "$K8S_NAMESPACE" --all-containers=true
      - name: Roll out application
        run: |
          set -euo pipefail
          sed -e "s|\${app_image}|$IMAGE|g" -e 's|\${app_replicas}|2|g' k8s/app/deployment.yaml > "$RUNNER_TEMP/deployment.yaml"
          kubectl apply -f "$RUNNER_TEMP/deployment.yaml"
          kubectl apply -f k8s/app/service.yaml
          kubectl apply -f k8s/app/hpa.yaml
          kubectl rollout status deployment/async-furious-api --namespace "$K8S_NAMESPACE" --timeout=10m
          kubectl wait pods --namespace "$K8S_NAMESPACE" --selector app=async-furious-api --for=condition=Ready --timeout=5m

  smoke-hml:
    name: Smoke test HML gateway
    needs: deploy-hml
    if: ${{ needs.deploy-hml.result == 'success' }}
    runs-on: ubuntu-latest
    environment: hml
    steps:
      - name: Check private gateway path
        env:
          SMOKE_TEST_URL: ${{ vars.SMOKE_TEST_URL }}
        run: |
          set -euo pipefail
          test -n "$SMOKE_TEST_URL" || { echo 'SMOKE_TEST_URL must point to the approved private gateway path.' >&2; exit 1; }
          curl --fail --silent --show-error --retry 10 --retry-delay 5 --max-time 20 "$SMOKE_TEST_URL"

  smoke-prod:
    name: Smoke test PROD gateway
    needs: deploy-prod
    if: ${{ needs.deploy-prod.result == 'success' }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check private gateway path
        env:
          SMOKE_TEST_URL: ${{ vars.SMOKE_TEST_URL }}
        run: |
          set -euo pipefail
          test -n "$SMOKE_TEST_URL" || { echo 'SMOKE_TEST_URL must point to the approved private gateway path.' >&2; exit 1; }
          curl --fail --silent --show-error --retry 10 --retry-delay 5 --max-time 20 "$SMOKE_TEST_URL"
