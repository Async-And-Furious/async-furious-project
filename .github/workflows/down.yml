name: HML / PROD down

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        default: hml
        type: choice
        options: [hml, prod]
      confirm:
        description: Type DESTROY HML or DESTROY PROD to confirm deletion
        required: true
        type: string

permissions:
  contents: read

jobs:
  cleanup:
    uses: ./.github/workflows/cleanup-eks.yml
    with:
      environment: ${{ inputs.environment }}
      aws_academy: ${{ inputs.environment == 'prod' }}
      operation: destroy
      confirm: ${{ inputs.confirm }}
    secrets: inherit
