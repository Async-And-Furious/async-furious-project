name: Terraform & Kubernetes

on:
  pull_request:
    paths:
      - "infra/**"
      - "k8s/**"
  push:
    branches:
      - main
      - develop
    paths:
      - "infra/**"
      - "k8s/**"
      - "Dockerfile"
      - "scripts/local-up.sh"
  workflow_dispatch:

jobs:
  # PRs: apenas valida e planeja, sem provisionar nada (rapido, seguro para rodar em toda PR)
  plan:
    name: Terraform Validate & Plan
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: "~> 1.6"

      - name: Terraform Init
        working-directory: infra/environments/local
        run: terraform init

      - name: Terraform Validate
        working-directory: infra/environments/local
        run: terraform validate

      - name: Terraform Plan
        working-directory: infra/environments/local
        run: terraform plan -input=false
        env:
          TF_VAR_db_password: ${{ secrets.TF_VAR_DB_PASSWORD }}
          TF_VAR_jwt_secret: ${{ secrets.TF_VAR_JWT_SECRET }}
          TF_VAR_seed_admin_email: ${{ secrets.TF_VAR_SEED_ADMIN_EMAIL }}
          TF_VAR_seed_admin_password: ${{ secrets.TF_VAR_SEED_ADMIN_PASSWORD }}
          TF_VAR_seed_recepcionista_password: ${{ secrets.TF_VAR_SEED_RECEPCIONISTA_PASSWORD }}
          TF_VAR_seed_mecanico_password: ${{ secrets.TF_VAR_SEED_MECANICO_PASSWORD }}

  # main/develop e execucao manual: aplica de verdade num cluster kind efemero no proprio runner
  # (kind usa apenas containers Docker, ja disponivel no runner ubuntu-latest — nao depende de nuvem)
  apply-and-deploy:
    name: Terraform Apply + Deploy no kind
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # The local plan is generated and applied by local-up.sh only after this gate.
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'homolog' }}

    env:
      TF_VAR_db_password: ${{ secrets.TF_VAR_DB_PASSWORD }}
      TF_VAR_jwt_secret: ${{ secrets.TF_VAR_JWT_SECRET }}
      TF_VAR_seed_admin_email: ${{ secrets.TF_VAR_SEED_ADMIN_EMAIL }}
      TF_VAR_seed_admin_password: ${{ secrets.TF_VAR_SEED_ADMIN_PASSWORD }}
      TF_VAR_seed_recepcionista_password: ${{ secrets.TF_VAR_SEED_RECEPCIONISTA_PASSWORD }}
      TF_VAR_seed_mecanico_password: ${{ secrets.TF_VAR_SEED_MECANICO_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: "~> 1.6"

      - name: Install kind
        run: |
          curl -Lo ./kind https://kind.sigs.k8s.io/dl/v0.32.0/kind-linux-amd64
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind

      - name: Setup kubectl
        uses: azure/setup-kubectl@829323503d1be3d00ca8346e5391ca0b07a9ab0d # v5

      - name: Provisionar cluster e implantar aplicacao (terraform apply)
        run: ./scripts/local-up.sh up

      - name: Estado do cluster
        if: always()
        run: kubectl get all -n async-furious || true

      - name: Logs dos pods (debug em caso de falha)
        if: always()
        run: |
          for pod in $(kubectl get pods -n async-furious -l app=async-furious-api -o jsonpath='{.items[*].metadata.name}'); do
            echo "### describe $pod ###"
            kubectl describe pod "$pod" -n async-furious || true
            for c in migrate seed api; do
              echo "### logs $pod -c $c ###"
              kubectl logs "$pod" -n async-furious -c "$c" || true
              echo "### logs $pod -c $c --previous ###"
              kubectl logs "$pod" -n async-furious -c "$c" --previous || true
            done
          done

      - name: Terraform + Kubernetes concluido
        if: success()
        run: |
          echo "### ✅ Terraform + Kubernetes concluído" >> "$GITHUB_STEP_SUMMARY"
          echo "Cluster kind provisionado via Terraform, aplicação implantada e smoke test em /api/v1 respondeu com sucesso." >> "$GITHUB_STEP_SUMMARY"
