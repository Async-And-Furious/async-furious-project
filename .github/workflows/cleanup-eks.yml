name: Cleanup Academy EKS application

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        default: hml
        type: choice
        options: [hml, prod]
      aws_academy:
        description: Confirm this is an AWS Academy environment
        required: true
        type: boolean
        default: true
      operation:
        description: Plan or remove the application namespace
        required: true
        default: destroy-plan
        type: choice
        options: [destroy-plan, destroy]
      confirm:
        description: Type DESTROY HML or DESTROY PROD when operation is destroy
        required: false
        type: string
  workflow_call:
    inputs:
      environment:
        description: Target environment
        required: true
        type: string
      aws_academy:
        description: Confirm this is an AWS Academy environment
        required: true
        type: boolean
        default: true
      operation:
        description: Plan or remove the application namespace
        required: true
        type: string
        default: destroy-plan
      confirm:
        description: Type DESTROY HML or DESTROY PROD when operation is destroy
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: app-eks-${{ inputs.environment }}
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  EKS_CLUSTER_NAME: tc3-eks-${{ inputs.environment }}
  TARGET_ENVIRONMENT: ${{ inputs.environment }}
  K8S_NAMESPACE: async-furious
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
  ECR_CLEANUP_OWNED: ${{ vars.ECR_CLEANUP_OWNED }}

jobs:
  cleanup:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment == 'prod' && 'production' || 'hml' }}
    steps:
      - name: Guard cleanup inputs
        env:
          TARGET_ENVIRONMENT: ${{ inputs.environment }}
          AWS_ACADEMY: ${{ inputs.aws_academy }}
          OPERATION: ${{ inputs.operation }}
          CONFIRM: ${{ inputs.confirm }}
        run: |
          set -euo pipefail
          [[ "$TARGET_ENVIRONMENT" == 'hml' || "$TARGET_ENVIRONMENT" == 'prod' ]] || { echo 'Unsupported cleanup environment.' >&2; exit 1; }
          [[ "$TARGET_ENVIRONMENT" != 'prod' || "$GITHUB_EVENT_NAME" == 'workflow_dispatch' || "$GITHUB_WORKFLOW_REF" == */.github/workflows/down.yml@* ]] || { echo 'Production cleanup is available only through workflow_dispatch.' >&2; exit 1; }
          [[ "$AWS_ACADEMY" == 'true' || ( ( "$GITHUB_EVENT_NAME" == 'workflow_dispatch' || "$GITHUB_EVENT_NAME" == 'workflow_call' ) && "$AWS_ACADEMY" == 'false' ) ]] || { echo 'Cleanup requires AWS Academy mode.' >&2; exit 1; }
          [[ "$OPERATION" == 'destroy-plan' || "$OPERATION" == 'destroy' ]] || { echo 'Unsupported cleanup operation.' >&2; exit 1; }
          expected_confirmation="DESTROY ${TARGET_ENVIRONMENT^^}"
          [[ "$OPERATION" != 'destroy' || "$CONFIRM" == "$expected_confirmation" ]] || { echo "Destroy requires exact confirmation: $expected_confirmation" >&2; exit 1; }
      - name: Configure AWS Academy credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        if: ${{ inputs.aws_academy == true }}
        with:
          aws-region: ${{ env.AWS_REGION }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
      - name: Configure AWS IAM user credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        if: ${{ (github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call') && inputs.aws_academy == false }}
        with:
          aws-region: ${{ env.AWS_REGION }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      - name: Detect EKS cluster
        id: cluster
        run: |
          set -euo pipefail
          error_file=$(mktemp)
          trap 'rm -f "$error_file"' EXIT
          if aws eks describe-cluster --region "$AWS_REGION" --name "$EKS_CLUSTER_NAME" >/dev/null 2>"$error_file"; then
            echo 'exists=true' >> "$GITHUB_OUTPUT"
          elif grep -q 'ResourceNotFoundException' "$error_file"; then
            cat "$error_file" >&2
            echo 'exists=false' >> "$GITHUB_OUTPUT"
            echo '### Cleanup result: EKS cluster is absent; nothing to remove.' >> "$GITHUB_STEP_SUMMARY"
          else
            cat "$error_file" >&2
            exit 1
          fi
      - name: Save original Academy HML EKS endpoint access
        id: endpoint
        if: ${{ steps.cluster.outputs.exists == 'true' }}
        run: |
          set -euo pipefail
          endpoint_config=$(aws eks describe-cluster \
            --region "$AWS_REGION" \
            --name "$EKS_CLUSTER_NAME" \
            --query 'cluster.resourcesVpcConfig' \
            --output json)
          original_public_access=$(jq -er '.endpointPublicAccess' <<<"$endpoint_config")
          original_private_access=$(jq -er '.endpointPrivateAccess' <<<"$endpoint_config")
          original_public_cidrs=$(jq -er '.publicAccessCidrs | join(",")' <<<"$endpoint_config")
          {
            echo "endpoint_private_access=$original_private_access"
            echo "endpoint_public_access=$original_public_access"
            echo "public_access_cidrs=$original_public_cidrs"
            echo 'saved=true'
          } >> "$GITHUB_OUTPUT"
      - name: Allow runner to reach Academy HML EKS
        if: ${{ steps.cluster.outputs.exists == 'true' }}
        run: |
          set -euo pipefail
          runner_ip=$(curl --fail --silent --show-error --ipv4 --proto '=https' https://checkip.amazonaws.com)
          runner_ip=$(python3 - "$runner_ip" <<'PY'
          import ipaddress
          import sys

          address = ipaddress.ip_address(sys.argv[1])
          if address.version != 4 or not address.is_global:
              raise SystemExit(f"Runner address is not a globally routable IPv4: {address}")
          print(address)
          PY
          )
          error_file=$(mktemp)
          trap 'rm -f "$error_file"' EXIT
          deadline=$((SECONDS + 600))
          while ! update_id=$(aws eks update-cluster-config \
            --region "$AWS_REGION" \
            --name "$EKS_CLUSTER_NAME" \
            --resources-vpc-config "endpointPrivateAccess=true,endpointPublicAccess=true,publicAccessCidrs=$runner_ip/32" \
            --query 'update.id' \
            --output text 2>"$error_file"); do
            error=$(<"$error_file")
            [[ "$error" == *ResourceInUseException* ]] || { printf '%s\n' "$error" >&2; exit 1; }
            (( SECONDS < deadline )) || { printf '%s\n' "$error" >&2; echo 'Timed out requesting the EKS endpoint update.' >&2; exit 1; }
            sleep 10
          done
          deadline=$((SECONDS + 600))
          while (( SECONDS < deadline )); do
            status=$(aws eks describe-update --region "$AWS_REGION" --name "$EKS_CLUSTER_NAME" --update-id "$update_id" --query 'update.status' --output text)
            [[ "$status" == 'Successful' ]] && exit 0
            [[ "$status" == 'Failed' || "$status" == 'Cancelled' ]] && { echo "EKS endpoint update ended with status $status." >&2; exit 1; }
            sleep 10
          done
          echo 'Timed out waiting for the EKS endpoint update.' >&2
          exit 1
      - name: Configure kubectl
        if: ${{ steps.cluster.outputs.exists == 'true' }}
        run: aws eks update-kubeconfig --region "$AWS_REGION" --name "$EKS_CLUSTER_NAME"
      - name: Wait for authenticated cluster access
        if: ${{ steps.cluster.outputs.exists == 'true' }}
        run: |
          deadline=$((SECONDS + 300))
          while (( SECONDS < deadline )); do
            kubectl get --raw=/readyz && exit 0
            sleep 10
          done
          echo 'Timed out waiting for authenticated EKS API access.' >&2
          exit 1
      - name: Preview application resources
        if: ${{ steps.cluster.outputs.exists == 'true' && inputs.operation == 'destroy-plan' }}
        run: |
          set -euo pipefail
          error_file=$(mktemp)
          trap 'rm -f "$error_file"' EXIT
          if [[ "$TARGET_ENVIRONMENT" == 'prod' ]]; then
            echo "### Cleanup preview: production application resources in \`$K8S_NAMESPACE\` are targeted; shared resources remain." >> "$GITHUB_STEP_SUMMARY"
          elif kubectl get namespace "$K8S_NAMESPACE" >/dev/null 2>"$error_file"; then
            echo "### Cleanup preview: namespace \`$K8S_NAMESPACE\` exists and needs removal." >> "$GITHUB_STEP_SUMMARY"
          elif grep -q 'NotFound' "$error_file"; then
            echo "### Cleanup preview: namespace \`$K8S_NAMESPACE\` is absent; nothing to remove." >> "$GITHUB_STEP_SUMMARY"
          else
            cat "$error_file" >&2
            exit 1
          fi
      - name: Remove application resources
        if: ${{ steps.cluster.outputs.exists == 'true' && inputs.operation == 'destroy' }}
        run: |
          set -euo pipefail
          if [[ "$TARGET_ENVIRONMENT" == 'prod' ]]; then
            # deploy-eks.yml owns these application resources; leave ExternalSecrets,
            # PVCs, the namespace, and shared infrastructure untouched.
            kubectl delete targetgroupbinding/async-furious-api deployment/async-furious-api \
              service/async-furious-service hpa/async-furious-hpa \
              configmap/async-furious-config secret/async-furious-secret \
              --namespace "$K8S_NAMESPACE" --ignore-not-found --wait --timeout=10m
            kubectl delete jobs --namespace "$K8S_NAMESPACE" \
              --selector app.kubernetes.io/part-of=async-furious \
              --ignore-not-found --wait --timeout=10m
          else
            kubectl delete jobs --namespace "$K8S_NAMESPACE" \
              --selector app.kubernetes.io/part-of=async-furious \
              --ignore-not-found --wait --timeout=10m
            kubectl delete namespace "$K8S_NAMESPACE" --ignore-not-found --wait --timeout=10m
          fi
      - name: Remove production-owned ECR images
        if: ${{ inputs.environment == 'prod' && inputs.operation == 'destroy' }}
        run: |
          set -euo pipefail
          [[ "$ECR_CLEANUP_OWNED" == 'true' ]] || { echo 'Production ECR cleanup is disabled unless this workflow owns the repository.' >&2; exit 1; }
          test -n "$ECR_REPOSITORY" || { echo 'ECR_REPOSITORY is required for production cleanup.' >&2; exit 1; }
          error_file=$(mktemp)
          trap 'rm -f "$error_file"' EXIT
          if ! aws ecr describe-repositories --repository-names "$ECR_REPOSITORY" >/dev/null 2>"$error_file"; then
            error=$(<"$error_file")
            [[ "$error" == *RepositoryNotFoundException* ]] || { printf '%s\n' "$error" >&2; exit 1; }
            echo 'Production ECR repository is absent; nothing to remove.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          image_tags=$(aws ecr describe-images --repository-name "$ECR_REPOSITORY" --filter tagStatus=TAGGED --query 'imageDetails[].imageTags[]' --output text | tr '\t' '\n' | awk '/^[0-9a-f]{40}$/')
          if [[ -n "$image_tags" ]]; then
            while IFS= read -r tag; do
              aws ecr batch-delete-image --repository-name "$ECR_REPOSITORY" --image-ids imageTag="$tag"
            done <<< "$image_tags"
          fi
          echo 'Removed only commit-SHA images published by deploy-eks.yml; the ECR repository remains intact.' >> "$GITHUB_STEP_SUMMARY"
      - name: Restore original Academy HML EKS endpoint access
        if: ${{ always() && steps.cluster.outputs.exists == 'true' && steps.endpoint.outputs.saved == 'true' }}
        env:
          ORIGINAL_PRIVATE_ACCESS: ${{ steps.endpoint.outputs.endpoint_private_access }}
          ORIGINAL_PUBLIC_ACCESS: ${{ steps.endpoint.outputs.endpoint_public_access }}
          ORIGINAL_PUBLIC_CIDRS: ${{ steps.endpoint.outputs.public_access_cidrs }}
        run: |
          set -euo pipefail
          error_file=$(mktemp)
          trap 'rm -f "$error_file"' EXIT
          deadline=$((SECONDS + 600))
          while ! update_id=$(aws eks update-cluster-config \
            --region "$AWS_REGION" \
            --name "$EKS_CLUSTER_NAME" \
            --resources-vpc-config "endpointPrivateAccess=$ORIGINAL_PRIVATE_ACCESS,endpointPublicAccess=$ORIGINAL_PUBLIC_ACCESS,publicAccessCidrs=$ORIGINAL_PUBLIC_CIDRS" \
            --query 'update.id' \
            --output text 2>"$error_file"); do
            error=$(<"$error_file")
            [[ "$error" == *ResourceNotFoundException* ]] && { printf '%s\n' "$error" >&2; exit 0; }
            [[ "$error" == *ResourceInUseException* ]] || { printf '%s\n' "$error" >&2; exit 1; }
            (( SECONDS < deadline )) || { printf '%s\n' "$error" >&2; echo 'Timed out requesting public endpoint restoration.' >&2; exit 1; }
            sleep 10
          done
          deadline=$((SECONDS + 600))
          while (( SECONDS < deadline )); do
            status=$(aws eks describe-update --region "$AWS_REGION" --name "$EKS_CLUSTER_NAME" --update-id "$update_id" --query 'update.status' --output text)
            [[ "$status" == 'Successful' ]] && exit 0
            [[ "$status" == 'Failed' || "$status" == 'Cancelled' ]] && { echo "EKS endpoint restoration ended with status $status." >&2; exit 1; }
            sleep 10
          done
          echo 'Timed out waiting for public endpoint restoration.' >&2
          exit 1
