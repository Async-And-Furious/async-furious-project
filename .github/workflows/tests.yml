name: Tests

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  test:
    # Nome mantido de propósito: a proteção atual da main exige o check "Run All Tests".
    # Trocar para "tests" somente junto com a troca dos required checks da main (ver progresso-I-333.md).
    name: Run All Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: workshop
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      # Stand-in do DocumentDB para o read model (API compatível com MongoDB 5.0). O DocumentDB real só é validado em HML.
      mongo:
        image: mongo:5.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongo --quiet --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: 'pnpm'

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Gerar cliente Prisma
        run: npx prisma generate

      - name: Lint (sem --fix)
        run: pnpm exec eslint "{src,test}/**/*.ts"

      - name: Type check
        run: pnpm run type:check

      - name: Testes unitários com gate de cobertura (80/80/80/80)
        run: pnpm run test:cov
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/workshop
          MONGODB_TEST_URI: mongodb://127.0.0.1:27017/os_read_model_test

      - name: Publicar relatório de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore
          retention-days: 7

      - name: Push database schema
        run: npx prisma db push --skip-generate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/workshop

      - name: Run e2e tests
        run: pnpm run test:e2e
        env:
          JWT_SECRET: ci-disposable-jwt-secret
          JWT_CUSTOMER_PUBLIC_KEY: test-jwt-customer-public-key
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/workshop

      - name: Run build
        run: pnpm run build

  sonar:
    name: sonar
    needs: test
    # Fork não recebe o SONAR_TOKEN; o job validate reprova se Sonar for exigido em main e for pulado.
    if: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Baixar cobertura gerada pelo job de testes
        uses: actions/download-artifact@v4
        with:
          name: coverage
          path: coverage

      - name: Análise SonarCloud e quality gate
        uses: SonarSource/sonarqube-scan-action@v8.4.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
        with:
          # Quality gate bloqueante em main e em PR para main; em develop é informativo.
          args: ${{ ((github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'main')) && '-Dsonar.qualitygate.wait=true' || '' }}

  validate:
    name: validate
    if: ${{ always() }}
    needs: [test, sonar]
    runs-on: ubuntu-latest
    steps:
      - name: Enforce required checks for main
        env:
          TEST_RESULT: ${{ needs.test.result }}
          SONAR_RESULT: ${{ needs.sonar.result }}
          SONAR_REQUIRED: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'main') }}
        run: |
          set -euo pipefail
          [[ "$TEST_RESULT" == 'success' ]] || { echo "Run All Tests did not pass: $TEST_RESULT" >&2; exit 1; }
          if [[ "$SONAR_REQUIRED" == 'true' && "$SONAR_RESULT" != 'success' ]]; then
            echo "Sonar is required for main but did not pass: $SONAR_RESULT" >&2
            exit 1
          fi
