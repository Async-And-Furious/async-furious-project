services:
  database:
    extends:
      file: ./docker-compose.dependencies.yml
      service: database

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: workshop-api
    restart: unless-stopped
    ports:
      - '5000:5000'
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/workshop
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      NODE_ENV: production
      PORT: 5000
    depends_on:
      database:
        condition: service_healthy

volumes:
  postgres_data:
