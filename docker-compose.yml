services:
  database:
    extends:
      file: ./docker-compose.dependencies.yml
      service: database

  read-model:
    extends:
      file: ./docker-compose.dependencies.yml
      service: read-model

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: workshop-api
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5433/workshop
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      NODE_ENV: development
      PORT: 3000
      DOCDB_URI: mongodb://read-model:27017
      DOCDB_NAME: os_read_model
    depends_on:
      database:
        condition: service_healthy
      read-model:
        condition: service_healthy

volumes:
  postgres_data:
